<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPT 편집기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22%23C43E1C%22%2F%3E%0A%20%20%3Crect%20x%3D%2296%22%20y%3D%22118%22%20width%3D%22320%22%20height%3D%22226%22%20rx%3D%2222%22%20fill%3D%22%23fff%22%2F%3E%0A%20%20%3Crect%20x%3D%22132%22%20y%3D%22154%22%20width%3D%22150%22%20height%3D%2228%22%20rx%3D%2214%22%20fill%3D%22%23C43E1C%22%2F%3E%0A%20%20%3Crect%20x%3D%22132%22%20y%3D%22206%22%20width%3D%22112%22%20height%3D%2216%22%20rx%3D%228%22%20fill%3D%22%23F2B8A5%22%2F%3E%0A%20%20%3Crect%20x%3D%22132%22%20y%3D%22236%22%20width%3D%2288%22%20height%3D%2216%22%20rx%3D%228%22%20fill%3D%22%23F2B8A5%22%2F%3E%0A%20%20%3Crect%20x%3D%22132%22%20y%3D%22266%22%20width%3D%22100%22%20height%3D%2216%22%20rx%3D%228%22%20fill%3D%22%23F2B8A5%22%2F%3E%0A%20%20%3Crect%20x%3D%22300%22%20y%3D%22248%22%20width%3D%2228%22%20height%3D%2264%22%20rx%3D%225%22%20fill%3D%22%23C43E1C%22%2F%3E%0A%20%20%3Crect%20x%3D%22340%22%20y%3D%22206%22%20width%3D%2228%22%20height%3D%22106%22%20rx%3D%225%22%20fill%3D%22%23E2774F%22%2F%3E%0A%20%20%3Crect%20x%3D%22244%22%20y%3D%22344%22%20width%3D%2224%22%20height%3D%2252%22%20fill%3D%22%23fff%22%2F%3E%0A%20%20%3Crect%20x%3D%22184%22%20y%3D%22390%22%20width%3D%22144%22%20height%3D%2224%22%20rx%3D%2212%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root {
  --bg: #eef0f3; --panel: #ffffff; --line: #d9dde3; --line2: #e8ebef; --text: #1f2328; --text2: #59636e; --text3: #8b949e;
  --accent: #c43e1c; --accent2: #e8572e; --sel: #2f6fed; --hover: #f2f4f7; --danger: #cf222e;
  --font: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 var(--font); overflow: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
#app { display: flex; flex-direction: column; height: 100%; }
#app[data-state="empty"] .need { visibility: hidden; }
#app[data-state="empty"] #stageWrap, #app[data-state="empty"] #notes, #app[data-state="empty"] #side, #app[data-state="empty"] #bar2 { display: none; }
#app:not([data-state="empty"]) #welcome { display: none; }

/* 도구 막대 */
.bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; min-height: 46px; }
.bar.sub { min-height: 40px; padding: 4px 10px; background: #fafbfc; }
.brand { display: flex; align-items: center; gap: 8px; margin-right: 8px; font-size: 15px; }
.brand .ver { color: var(--text3); font-size: 11px; }
.logo { width: 26px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, var(--accent2), var(--accent)); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 15px; }
.logo.big { width: 64px; height: 64px; border-radius: 14px; font-size: 36px; margin: 0 auto 10px; }
.grp { display: flex; align-items: center; gap: 2px; padding: 0 6px; border-right: 1px solid var(--line2); }
.grp:last-child, .grp.right { border-right: 0; }
.grp.right { margin-left: auto; }
.btn, .ibtn { border: 1px solid transparent; background: transparent; border-radius: 6px; height: 32px; padding: 0 9px; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; }
.ibtn { width: 32px; padding: 0; justify-content: center; }
.ibtn.sm, .btn.sm { height: 28px; font-size: 12px; }
.ibtn.sm { width: auto; padding: 0 6px; }
.btn:hover, .ibtn:hover { background: var(--hover); border-color: var(--line2); }
.btn:active, .ibtn:active { background: #e6e9ee; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent2); }
.btn.lg { height: 42px; padding: 0 22px; font-size: 15px; }
.btn[disabled], .ibtn[disabled] { opacity: .4; pointer-events: none; }
.ibtn[aria-pressed="true"] { background: #e3ebfd; border-color: #b9cdf9; color: var(--sel); }
.btn svg, .ibtn svg { width: 18px; height: 18px; flex: none; }
select, input[type="number"] { height: 30px; border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 0 6px; }
#fFont { width: 150px; }
#fSize { width: 58px; }
.clr { position: relative; display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 7px; border-radius: 6px; cursor: pointer; }
.clr:hover { background: var(--hover); }
.clr input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.clr .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0, 0, 0, .25); background: #c00000; }
.clr .sw.line { background: transparent !important; border: 3px solid #333; }
.clr .lbl { font-size: 12px; color: var(--text2); }
.zl { width: 44px; text-align: center; color: var(--text2); font-size: 12px; }
.dd { position: relative; }
.menu { position: absolute; top: 36px; left: 0; z-index: 50; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, .14); padding: 8px; display: grid; grid-template-columns: repeat(6, 40px); gap: 4px; }
.menu button { width: 40px; height: 36px; border: 1px solid transparent; border-radius: 6px; background: transparent; cursor: pointer; display: grid; place-items: center; }
.menu button:hover { background: var(--hover); border-color: var(--line2); }
.menu svg { width: 26px; height: 22px; }

/* 본문 */
#main { flex: 1; display: flex; min-height: 0; }
#side { width: 188px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
#thumbs { flex: 1; overflow-y: auto; padding: 10px 10px 4px 6px; }
.thumb { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 10px; cursor: pointer; }
.thumb .no { width: 18px; text-align: right; color: var(--text3); font-size: 11px; padding-top: 2px; flex: none; }
.thumb .tv { position: relative; overflow: hidden; border: 2px solid var(--line); border-radius: 4px; background: #fff; flex: none; }
.thumb.cur .tv { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(196, 62, 28, .18); }
.thumb.drop-before .tv { box-shadow: 0 -4px 0 var(--sel); }
.thumb.drop-after .tv { box-shadow: 0 4px 0 var(--sel); }
.thumb.dragging { opacity: .4; }
.thumb.hid .tv { opacity: .45; }
.thumb.hid .no { text-decoration: line-through; }
.thumb .tv > .slide { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
.sidebtns { display: flex; gap: 4px; padding: 8px; border-top: 1px solid var(--line2); }
.sidebtns .btn { flex: 1; justify-content: center; }
#work { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
#welcome { flex: 1; display: grid; place-items: center; padding: 24px; }
.wbox { text-align: center; max-width: 520px; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 34px 30px 26px; box-shadow: 0 6px 28px rgba(0, 0, 0, .06); }
.wbox h1 { margin: 0 0 10px; font-size: 22px; }
.wbox p { color: var(--text2); margin: 0 0 18px; }
.wbox .hint { margin: 10px 0 16px; font-size: 12px; color: var(--text3); }
#stageWrap { flex: 1; overflow: auto; position: relative; display: flex; min-height: 0; }
#stage { position: relative; margin: auto; flex: none; transform-origin: 0 0; }
#slideHost, #overlay { position: absolute; left: 0; top: 0; }
#slideHost .slide { box-shadow: 0 2px 14px rgba(0, 0, 0, .16); }
#overlay { pointer-events: none; }
#notes { flex: none; height: 92px; border-top: 1px solid var(--line); background: var(--panel); display: flex; gap: 8px; padding: 8px 12px; }
#notes label { color: var(--text3); font-size: 12px; padding-top: 4px; }
#notes textarea { flex: 1; resize: none; border: 1px solid var(--line2); border-radius: 6px; padding: 6px 8px; background: #fcfcfd; }
#notes textarea:focus { outline: 2px solid #c9d8fb; border-color: #9db8f6; }
#status { height: 24px; display: flex; gap: 18px; align-items: center; padding: 0 12px; background: #f6f7f9; border-top: 1px solid var(--line); color: var(--text2); font-size: 12px; }

/* 슬라이드 내용 */
.slide { position: relative; overflow: hidden; background: #fff; user-select: none; -webkit-user-select: none; }
.slide .shp { position: absolute; transform-origin: 50% 50%; }
.slide .geo { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.slide .tx { position: absolute; display: flex; flex-direction: column; overflow: visible; pointer-events: none; }
.slide .tx.nowrap .txi { width: max-content; min-width: 100%; }
.slide .txi { outline: none; word-break: keep-all; overflow-wrap: anywhere; white-space: pre-wrap; tab-size: 4; cursor: inherit; }
.slide .txi[contenteditable="true"] { pointer-events: auto; cursor: text; user-select: text; -webkit-user-select: text; caret-color: #111; }
.slide .p { margin: 0; min-height: 1em; }
.slide .bu { user-select: none; }
.slide .pic .clip { position: absolute; inset: 0; overflow: hidden; }
.slide .pic img { position: absolute; display: block; max-width: none; }
.slide .pic .clip.missing { background: repeating-linear-gradient(45deg, #f1f3f5, #f1f3f5 8px, #e5e8ec 8px, #e5e8ec 16px); display: grid; place-items: center; color: #6b7280; font-size: 12px; text-align: center; }
.slide .ph-note { position: absolute; inset: 0; display: grid; place-items: center; background: #f6f7f9; color: #6b7280; border: 1px dashed #c6ccd4; font-size: 13px; }
.slide .tbl table { border-collapse: collapse; table-layout: fixed; width: 100%; }
.slide .tbl td { overflow: hidden; }
.slide .tbl .tx.cell { display: block; }
.slide .chartbox, .slide .chartbox svg { position: absolute; inset: 0; }
.slide .chartbox text { font-family: var(--font); }
.slide .empty-ph .tx::before { content: attr(data-prompt); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #9aa1aa; font-size: 20px; border: 1px dashed #b9c0c9; }
.slide .empty-ph.editing .tx::before { display: none; }
.slide.edit .obj { cursor: move; touch-action: none; }
.selbox .hd { touch-action: none; }
.slide.edit .obj.editing { cursor: text; }

/* 선택 표시 */
.selbox { position: absolute; border: 1px solid var(--sel); pointer-events: none; transform-origin: 50% 50%; }
.selbox.multi { border-style: dashed; }
.selbox .hd { position: absolute; width: var(--hs); height: var(--hs); margin: calc(var(--hs) / -2) 0 0 calc(var(--hs) / -2); background: #fff; border: 1px solid var(--sel); border-radius: 2px; pointer-events: auto; }
.selbox .hd.rot { border-radius: 50%; background: #fff; }
.selbox .rotline { position: absolute; left: 50%; width: 1px; background: var(--sel); }
.marquee { position: absolute; border: 1px dashed var(--sel); background: rgba(47, 111, 237, .07); pointer-events: none; }
.guide { position: absolute; background: #e0377a; pointer-events: none; }

/* 슬라이드 쇼 */
#show { position: fixed; inset: 0; z-index: 100; background: #000; display: grid; place-items: center; cursor: none; }
#show.cursor { cursor: default; }
#showSlide { position: relative; }
#showSlide .slide { transform-origin: 0 0; position: absolute; left: 0; top: 0; }
#showInfo { position: fixed; right: 16px; bottom: 12px; color: rgba(255, 255, 255, .55); font-size: 13px; }

/* 대화상자·알림 */
#dialog { position: fixed; inset: 0; z-index: 90; background: rgba(15, 20, 30, .35); display: grid; place-items: center; }
.dlg { background: #fff; border-radius: 14px; padding: 20px 22px 16px; min-width: 320px; max-width: 520px; box-shadow: 0 20px 60px rgba(0, 0, 0, .25); }
.dlg h2 { margin: 0 0 10px; font-size: 17px; }
.dlg p { margin: 0 0 14px; color: var(--text2); }
.dlg .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.dlg .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.dlg .layouts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-height: 60vh; overflow: auto; }
.dlg .layouts button { border: 2px solid var(--line); border-radius: 6px; background: #fff; padding: 4px; cursor: pointer; text-align: center; font-size: 11px; color: var(--text2); }
.dlg .layouts button:hover { border-color: var(--accent); }
.dlg .layouts .lv { position: relative; overflow: hidden; margin-bottom: 3px; background: #fff; }
.dlg .layouts .lv .slide { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
.dlg .layouts .lvn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 132px; }
.dlg input[type="number"] { width: 70px; }
#toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 120; background: #1f2328; color: #fff; padding: 10px 16px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, .22); max-width: 80vw; }
#dropZone { position: fixed; inset: 0; z-index: 80; background: rgba(196, 62, 28, .12); border: 4px dashed var(--accent); display: grid; place-items: center; font-size: 22px; color: var(--accent); font-weight: 700; pointer-events: none; }

/* 인쇄(PDF) */
#printArea { display: none; }
@media print {
  html, body { overflow: visible; height: auto; background: #fff; }
  #app, #show, #dialog, #toast, #dropZone, #ctxMenu { display: none !important; }
  #printArea { display: block; }
  #printArea .page { position: relative; overflow: hidden; page-break-after: always; break-after: page; }
  #printArea .page:last-child { page-break-after: auto; break-after: auto; }
  #printArea .slide { box-shadow: none; transform-origin: 0 0; }
  .slide .empty-ph .tx::before { display: none; }
}

/* 쇼 끝·검은/흰 화면, 쓸 수 없는 단추 */
#show .showend { width: 100%; height: 100%; display: grid; place-items: center; color: #cfd3d8; font-size: 18px; }
#show.black #showSlide, #show.white #showSlide { visibility: hidden; }
#show.white { background: #fff; }
.clr:has(input:disabled), select:disabled, input:disabled { opacity: .45; pointer-events: none; }
.slide .tx.vert .txi { height: 100%; }

/* 오른쪽 단추 메뉴·도움말 */
.ctx { position: fixed; z-index: 95; min-width: 200px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, .16); padding: 5px; }
.ctx button { display: flex; width: 100%; justify-content: space-between; gap: 18px; align-items: center; border: 0; background: transparent; padding: 7px 10px; border-radius: 6px; cursor: pointer; text-align: left; }
.ctx button:hover { background: var(--hover); }
.ctx button[disabled] { opacity: .4; pointer-events: none; }
.ctx kbd, .keys kbd { font: 11px/1.4 var(--font); color: var(--text3); }
.ctx .sep { height: 1px; background: var(--line2); margin: 4px 6px; }
#bHelp { font-weight: 700; color: var(--text2); }
.keys { border-collapse: collapse; width: 100%; margin-bottom: 10px; }
.keys td { padding: 4px 6px; border-bottom: 1px solid var(--line2); font-size: 12.5px; }
.keys td:last-child { text-align: right; }
.keys kbd { color: var(--text2); font-size: 12px; }
.dlg p.small { font-size: 12px; color: var(--text3); margin: 0; }

/* 앱 설치 안내(웹 주소에서만) */
#welcome .wapp { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line2); }
#welcome .wapp .hint { max-width: 360px; margin: 8px auto 0; }

/* ── 휴대폰(좁은 화면): 도구 막대는 한 줄로 밀어 보기, 슬라이드 목록은 아래 가로 띠 ── */
@media (max-width: 760px) {
  .bar { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; gap: 2px; padding: 4px 6px; min-height: 44px; }
  .bar::-webkit-scrollbar { display: none; }
  .bar.sub { min-height: 42px; padding: 3px 6px; }
  .grp { flex: none; padding: 0 4px; }
  .grp.right { margin-left: 0; }
  .brand { margin-right: 4px; flex: none; }
  .brand b, .brand .ver { display: none; }
  #bar1 .btn > span { display: none; }
  #bar1 .btn { padding: 0 9px; height: 36px; }
  .ibtn { width: 36px; height: 36px; }
  #main { flex-direction: column-reverse; }
  #side { width: auto; height: 104px; flex-direction: row; border-right: 0; border-top: 1px solid var(--line); }
  #thumbs { display: flex; flex-direction: row; gap: 8px; overflow-x: auto; overflow-y: hidden; padding: 8px 8px 6px; }
  .thumb { flex-direction: column; gap: 2px; margin: 0; flex: none; }
  .thumb .no { width: auto; text-align: left; padding: 0 0 0 2px; line-height: 1; }
  .thumb.drop-before .tv { box-shadow: -4px 0 0 var(--sel); }
  .thumb.drop-after .tv { box-shadow: 4px 0 0 var(--sel); }
  #side .sidebtns { flex-direction: column; justify-content: center; border-top: 0; border-left: 1px solid var(--line2); padding: 4px; order: -1; }
  #sAdd > span { display: none; }
  #notes { height: 58px; padding: 6px 8px; }
  #notes label { display: none; }
  #status { gap: 10px; font-size: 11px; }
  #stSel { display: none; }
  .dlg { min-width: 0; width: calc(100vw - 24px); padding: 16px 14px 12px; }
  .dlg .layouts { grid-template-columns: repeat(2, 1fr); }
  #welcome .wbox { padding: 0 4px; }
}
#welcome .wmoved { margin: 16px auto 0; max-width: 380px; padding: 12px 14px; border: 1px solid #f3c7b8; background: #fff6f2; border-radius: 10px; }
#welcome .wmoved p { margin: 4px 0 10px; color: var(--text2); font-size: 13px; }
#welcome .wmoved a.btn { text-decoration: none; display: inline-flex; }
</style>
</head>
<body>
<div id="app" data-state="empty">
  <header class="bar" id="bar1">
    <div class="brand"><span class="logo">P</span><b>PPT 편집기</b><span class="ver" id="ver"></span></div>
    <div class="grp">
      <button id="bOpen" class="btn" title="열기 (Ctrl+O)"></button>
      <button id="bSave" class="btn need" title="저장 (Ctrl+S)"></button>
      <button id="bSaveAs" class="btn need" title="다른 이름으로 저장"></button>
    </div>
    <div class="grp need">
      <button id="bUndo" class="ibtn" title="실행 취소 (Ctrl+Z)"></button>
      <button id="bRedo" class="ibtn" title="다시 실행 (Ctrl+Y)"></button>
    </div>
    <div class="grp need">
      <button id="bText" class="btn" title="텍스트 상자 넣기"></button>
      <button id="bImage" class="btn" title="그림 넣기"></button>
      <div class="dd"><button id="bShape" class="btn" title="도형 넣기"></button><div class="menu" id="shapeMenu" hidden></div></div>
      <button id="bTable" class="btn" title="표 넣기"></button>
    </div>
    <div class="grp right need">
      <button id="bPdf" class="btn" title="PDF로 저장(인쇄)"></button>
      <button id="bShow" class="btn primary" title="슬라이드 쇼 (F5, Shift+누르기: 지금 슬라이드부터)"></button>
      <button id="bHelp" class="ibtn" title="도움말·단축키">?</button>
    </div>
  </header>
  <header class="bar sub need" id="bar2">
    <div class="grp">
      <select id="fFont" title="글꼴"></select>
      <input id="fSize" type="number" min="1" max="400" step="1" title="글자 크기(pt)">
      <button id="fGrow" class="ibtn" title="글자 크게"></button>
      <button id="fShrink" class="ibtn" title="글자 작게"></button>
    </div>
    <div class="grp">
      <button id="fB" class="ibtn" title="굵게 (Ctrl+B)"><b>가</b></button>
      <button id="fI" class="ibtn" title="기울임 (Ctrl+I)"><i>가</i></button>
      <button id="fU" class="ibtn" title="밑줄 (Ctrl+U)"><u>가</u></button>
      <button id="fS" class="ibtn" title="취소선"><s>가</s></button>
      <label class="clr" title="글자 색"><span class="sw" id="fColorSw"></span><span class="lbl">가</span><input id="fColor" type="color"></label>
    </div>
    <div class="grp">
      <button id="aL" class="ibtn" title="왼쪽 맞춤"></button>
      <button id="aC" class="ibtn" title="가운데 맞춤"></button>
      <button id="aR" class="ibtn" title="오른쪽 맞춤"></button>
      <button id="aJ" class="ibtn" title="양쪽 맞춤"></button>
      <button id="fBul" class="ibtn" title="글머리 기호"></button>
      <button id="fNum" class="ibtn" title="번호 매기기"></button>
    </div>
    <div class="grp">
      <label class="clr" title="도형 채우기"><span class="sw" id="sFillSw"></span><span class="lbl">채우기</span><input id="sFill" type="color"></label>
      <button id="sNoFill" class="ibtn sm" title="채우기 없음">없음</button>
      <label class="clr" title="도형 윤곽선"><span class="sw line" id="sLineSw"></span><span class="lbl">윤곽선</span><input id="sLine" type="color"></label>
      <select id="sLineW" title="윤곽선 두께"><option value="">두께</option><option value="0">없음</option><option value="0.75">0.75pt</option><option value="1.5">1.5pt</option><option value="2.25">2.25pt</option><option value="3">3pt</option><option value="4.5">4.5pt</option><option value="6">6pt</option></select>
    </div>
    <div class="grp">
      <button id="zFront" class="ibtn" title="맨 앞으로"></button>
      <button id="zBack" class="ibtn" title="맨 뒤로"></button>
      <button id="bDup" class="ibtn" title="복제 (Ctrl+D)"></button>
      <button id="bDel" class="ibtn" title="삭제 (Delete)"></button>
    </div>
    <div class="grp right">
      <button id="zOut" class="ibtn" title="축소"></button>
      <span id="zLabel" class="zl">100%</span>
      <button id="zIn" class="ibtn" title="확대"></button>
      <button id="zFit" class="btn sm" title="창에 맞춤">맞춤</button>
    </div>
  </header>
  <main id="main">
    <aside id="side" class="need">
      <div id="thumbs"></div>
      <div class="sidebtns">
        <button id="sAdd" class="btn sm" title="새 슬라이드"></button>
        <button id="sDup" class="ibtn" title="슬라이드 복제"></button>
        <button id="sDel" class="ibtn" title="슬라이드 삭제"></button>
      </div>
    </aside>
    <section id="work">
      <div id="welcome">
        <div class="wbox">
          <div class="logo big">P</div>
          <h1>PPT 편집기</h1>
          <p>PowerPoint 파일(.pptx, .ppt)을 열어 글자·도형·그림·슬라이드를 고치고 .pptx 로 저장합니다.<br>파일은 이 컴퓨터 안에서만 처리되고 어디에도 올라가지 않습니다.</p>
          <button id="wOpen" class="btn primary lg">파일 열기</button>
          <p class="hint">또는 파일을 이 창에 끌어다 놓으세요</p>
          <button id="wNew" class="btn">새 발표 자료</button>
          <div id="wMoved" class="wmoved" hidden></div>
          <div id="wApp" class="wapp" hidden>
            <button id="wInstall" class="btn">앱으로 설치</button>
            <p class="hint">설치하면 PC 는 파일 탐색기에서 .pptx·.ppt 파일을 두 번 눌러(연결 프로그램 → PPT 편집기), 휴대폰은 파일의 ‘공유 → PPT 편집기’로 바로 열 수 있습니다.</p>
          </div>
        </div>
      </div>
      <div id="stageWrap"><div id="stage"><div id="slideHost"></div><div id="overlay"></div></div></div>
      <div id="notes" class="need"><label for="notesText">메모</label><textarea id="notesText" placeholder="슬라이드 노트(발표자 메모)를 입력하세요"></textarea></div>
    </section>
  </main>
  <footer id="status"><span id="stFile"></span><span id="stSlide"></span><span id="stSel"></span></footer>
</div>
<div id="dropZone" hidden><div>여기에 놓으면 엽니다</div></div>
<div id="show" hidden><div id="showSlide"></div><div id="showInfo"></div></div>
<div id="printArea"></div>
<div id="dialog" hidden></div>
<div id="toast" hidden></div>
<div id="ctxMenu" class="ctx" hidden></div>
<input id="fileIn" type="file" accept=".pptx,.ppt,.potx,.ppsx,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.ms-powerpoint" hidden>

// spPr → 모양
function shapeGeom(spPr, wPx, hPx) {

// ── 05-text.js ──
// ───────────────────────── 글자: 서식 상속과 그리기 ─────────────────────────
// 서식은 낮은 우선순위부터 [기본 글자 서식 · 마스터 글자 서식 · 마스터 틀 · 레이아웃 틀 · 도형 자신] 순서로 쌓인다.
const KO_FALLBACK = "'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif";

// 글자 서식 출처 목록 만들기 → {srcs, own}  (own = 도형 자신의 목록 수: 글꼴 참조 색보다 앞선다)
function textSources(info, sp, deck, txBody) {
  const srcs = [];
  const master = info.masterDoc && info.masterDoc.documentElement;
  const ph = phOf(sp);
  if (info.kind === 'notes') {
    srcs.push(master && kid(master, 'notesStyle'));
  } else {
    const tx = master && kid(master, 'txStyles');
    if (ph) {
      const t = normPh(phType(ph));
      srcs.push(kid(tx, t === 'title' ? 'titleStyle' : t === 'body' ? 'bodyStyle' : 'otherStyle'));
    } else {

      srcs.push(kid(tx, 'otherStyle'));

  if (ph) for (const anc of phChain(info, sp)) srcs.push(path(anc, 'txBody', 'lstStyle'));

  return { srcs: own ? [...inherited, own] : inherited, own: own ? 1 : 0 };

// 단계(lvl)별 pPr 목록: 낮은 → 높은 우선순위

}
const pick = (list, fn) => { for (let i = list.length - 1; i >= 0; i--) { const v = fn(list[i]); if (v != null) return v; } return null; };

// 문단 서식 풀기

  const ownN = ts.own ? levelPPrs(ts.srcs.slice(-1), lvl).length : 0;
  const list = pPr ? [...inherited, pPr] : inherited;
  const a = n => pick(list, e => (e.hasAttribute(n) ? e.getAttribute(n) : null));
  const child = n => pick(list, e => kid(e, n));
  const bu = pick(list, e => kids(e).find(k => ['buNone', 'buChar', 'buAutoNum', 'buBlip'].includes(ln(k))) || null);
  return {
    lvl, algn: a('algn') || 'l', marL: +(a('marL') || 0), indent: +(a('indent') || 0), rtl: a('rtl') === '1',
    lnSpc: child('lnSpc'), spcBef: child('spcBef'), spcAft: child('spcAft'),
    bu, buClr: pick(list, e => kid(e, 'buClr') || (kid(e, 'buClrTx') ? 'tx' : null)), buSz: pick(list, e => kid(e, 'buSzPct') || kid(e, 'buSzPts') || (kid(e, 'buSzTx') ? 'tx' : null)),
    buFont: pick(list, e => kid(e, 'buFont') || (kid(e, 'buFontTx') ? 'tx' : null)),

    ownDef: [...list.slice(list.length - ownN - (pPr ? 1 : 0))].map(e => kid(e, 'defRPr')).filter(Boolean),
  };
}

// 글자 서식 풀기: defRPrs(낮은→높은) + rPr
function runStyle(ps, rPr, tctx) {
  const list = rPr ? [...ps.defRPrs, rPr] : ps.defRPrs;

  const ctx = tctx.ctx, theme = ctx.theme;

  const fillIn = l => pick(l, e => kids(e).find(k => ['solidFill', 'gradFill', 'noFill'].includes(ln(k))) || null);
  let fe = fillIn(ownList);

  else { fe = fillIn(list); color = fe ? fillColor(fe, ctx) : colorOf(parseXML(`<a:schemeClr xmlns:a="${NS.a}" val="tx1"/>`).documentElement, ctx); }

function fillColor(fe, ctx) {

const fontStack = (latin, ea) => [latin, ea].filter(Boolean).map(f => `'${f.replace(/'/g, '')}'`).concat(KO_FALLBACK).join(',');

// 글자 상자 속성(bodyPr): 마스터 틀 → 레이아웃 틀 → 도형
function bodyProps(info, sp, txBody) {
  const chain = phChain(info, sp).map(a => path(a, 'txBody', 'bodyPr')).filter(Boolean);
  const own = txBody ? kid(txBody, 'bodyPr') : null;
  const list = own ? [...chain, own] : chain;
  const a = (n, d) => { const v = pick(list, e => (e.hasAttribute(n) ? e.getAttribute(n) : null)); return v == null ? d : v; };
  const fit = pick(list, e => kids(e).find(k => ['normAutofit', 'spAutoFit', 'noAutofit'].includes(ln(k))) || null);

    anchor: a('anchor', 't'), anchorCtr: a('anchorCtr', '0') === '1',
    l: px(+a('lIns', 91440)), t: px(+a('tIns', 45720)), r: px(+a('rIns', 91440)), b: px(+a('bIns', 45720)),
    wrap: a('wrap', 'square'), vert: a('vert', 'horz'), rot: +a('rot', 0) / 60000,
    fit: fit ? ln(fit) : null,
    fontScale: fit && ln(fit) === 'normAutofit' ? num(fit, 'fontScale', 100000) / 100000 : 1,
    lnRed: fit && ln(fit) === 'normAutofit' ? num(fit, 'lnSpcReduction', 0) / 100000 : 0,

}

const ROMAN = n => { const m = [[1000, 'm'], [900, 'cm'], [500, 'd'], [400, 'cd'], [100, 'c'], [90, 'xc'], [50, 'l'], [40, 'xl'], [10, 'x'], [9, 'ix'], [5, 'v'], [4, 'iv'], [1, 'i']]; let s = ''; for (const [v, r] of m) while (n >= v) { s += r; n -= v; } return s; };

// 글자 상자 그리기 → div.tx(세로 정렬) > div.txi(편집 영역) > div.p(문단) > span.r(글자 조각)
function renderText(txBody, tctx, box) {
  const bp = tctx.bp;
  const outer = h('div', { class: 'tx' });
  const st = outer.style;
  st.left = (box.tl || 0) + bp.l + 'px'; st.top = (box.tt || 0) + bp.t + 'px';
  st.width = Math.max(1, box.w - (box.tl || 0) - (box.tr || 0) - bp.l - bp.r) + 'px';
  st.height = Math.max(1, box.h - (box.tt || 0) - (box.tb || 0) - bp.t - bp.b) + 'px';
  st.justifyContent = { t: 'flex-start', ctr: 'center', b: 'flex-end', just: 'center', dist: 'center' }[bp.anchor] || 'flex-start';
  const inner = h('div', { class: 'txi' });
  if (bp.wrap === 'none') { inner.style.whiteSpace = 'pre'; outer.classList.add('nowrap'); }
  if (bp.vert === 'eaVert' || bp.vert === 'vert' || bp.vert === 'wordArtVertRtl') { inner.style.writingMode = 'vertical-rl'; outer.classList.add('vert'); }
  else if (bp.vert === 'vert270') { inner.style.writingMode = 'vertical-rl'; inner.style.transform = 'rotate(180deg)'; outer.classList.add('vert'); }
  if (bp.anchorCtr) inner.style.alignSelf = 'center';

  const paras = txBody ? kids(txBody, 'p') : [];
  const runsMap = [];
  const counters = {};
  let lastLvl = -1, empty = true;
  paras.forEach((p, pi) => {
    const pPr = kid(p, 'pPr');
    const ps = paraStyle(tctx.ts, pPr);
    const items = kids(p).filter(k => ['r', 'br', 'fld'].includes(ln(k)));
    runsMap[pi] = items;
    const div = h('div', { class: 'p', dataset: { pi: String(pi), algn: ps.algn } });
    const ds = div.style;
    ds.textAlign = ALGN_CSS[ps.algn] || 'left';
    if (ps.rtl) div.dir = 'rtl';
    // 문단의 기본 글자(빈 줄 높이·새로 쓰는 글자)
    const endR = kid(p, 'endParaRPr');
    const firstR = items.find(k => ln(k) === 'r');
    const baseStyle = runStyle(ps, (firstR && kid(firstR, 'rPr')) || endR, tctx);
    const fsz = baseStyle.sz * scale;
    applyRunCss(div, baseStyle, scale);
    markRun(div, baseStyle);
    // 줄 간격
    const lnPct = ps.lnSpc && kid(ps.lnSpc, 'spcPct') ? num(kid(ps.lnSpc, 'spcPct'), 'val', 100000) / 100000 : null;
    const lnPts = ps.lnSpc && kid(ps.lnSpc, 'spcPts') ? num(kid(ps.lnSpc, 'spcPts'), 'val', 0) / 100 : null;
    if (lnPts) ds.lineHeight = ptPx(lnPts * scale) + 'px';
    else ds.lineHeight = String(Math.max(0.5, (lnPct || 1) - bp.lnRed) * 1.2);
    const sp = (e, size) => { if (!e) return 0; const pc = kid(e, 'spcPct'), pt = kid(e, 'spcPts'); return pt ? ptPx(num(pt, 'val', 0) / 100) : pc ? ptPx(size) * 1.2 * num(pc, 'val', 0) / 100000 : 0; };
    ds.marginTop = (pi === 0 ? 0 : sp(ps.spcBef, fsz)) + 'px';
    ds.marginBottom = sp(ps.spcAft, fsz) + 'px';
    const marL = px(ps.marL), ind = px(ps.indent);
    ds.paddingLeft = marL + 'px';
    // 글머리표
    const buKind = ps.bu ? ln(ps.bu) : 'buNone';
    const hasText = items.some(k => ln(k) !== 'br' && (k.textContent || '').length);
    if (!(ps.lvl in counters) || buKind !== 'buAutoNum') { /* 번호 아닌 문단이 끼면 끊긴다 */ }
    if (ps.lvl < lastLvl) for (const k of Object.keys(counters)) if (+k > ps.lvl) delete counters[k];
    if (buKind !== 'buAutoNum') delete counters[ps.lvl];
    lastLvl = ps.lvl;
    let buText = null;
    if (hasText && buKind === 'buChar') buText = attr(ps.bu, 'char', '•');
    else if (hasText && buKind === 'buAutoNum') {
      const start = num(ps.bu, 'startAt', 1);
      counters[ps.lvl] = (counters[ps.lvl] || start - 1) + 1;
      buText = autoNum(attr(ps.bu, 'type'), counters[ps.lvl]);
    }
    if (buText != null) {
      const bu = h('span', { class: 'bu', contenteditable: 'false', text: buText });
      const bs = bu.style;
      let bsz = baseStyle.sz * scale;
      if (ps.buSz && ps.buSz !== 'tx') bsz = ln(ps.buSz) === 'buSzPct' ? bsz * num(ps.buSz, 'val', 100000) / 100000 : num(ps.buSz, 'val', 0) / 100 * scale;
      bs.fontSize = ptPx(bsz) + 'px';
      const bc = ps.buClr && ps.buClr !== 'tx' ? colorOf(ps.buClr, tctx.ctx) : baseStyle.color;
      bs.color = css(bc);
      if (ps.buFont && ps.buFont !== 'tx') bs.fontFamily = fontStack(tctx.ctx.theme.face(attr(ps.buFont, 'typeface')), '');
      if (ind < 0) { bs.display = 'inline-block'; bs.width = -ind + 'px'; bs.marginLeft = ind + 'px'; bs.textIndent = '0'; }
      else { bs.marginLeft = ind + 'px'; bs.paddingRight = '0.4em'; }
      div.append(bu);
    } else if (ind) ds.textIndent = ind + 'px';
    items.forEach((it, ri) => {
      const k = ln(it);
      if (k === 'br') { div.append(h('br', { dataset: { ri: String(ri), pi: String(pi) } })); return; }
      const rPr = kid(it, 'rPr');
      const rs = runStyle(ps, rPr, tctx);
      let text = (kid(it, 't') || {}).textContent || '';
      if (k === 'fld') {
        const ft = attr(it, 'type', '');

      }

    inner.append(div);
  });

  inner._txBody = txBody; inner._paras = paras; inner._runs = runsMap; inner._scale = scale; inner._tctx = tctx;
  outer._inner = inner; outer._empty = empty;
  outer.append(inner);
  return outer;
}

function applyRunCss(e, rs, scale) {

// 그릴 때의 서식을 적어 둔다(편집 후 무엇이 바뀌었는지 비교)
function markRun(e, rs) {

  d.c = rs.color && rs.color.a > 0 ? toHex(rs.color) : '';
  d.sz = String(Math.round(rs.sz * 100));
  d.szpx = String(parseFloat(e.style.fontSize));
  d.ff = e.style.fontFamily;
}

// ── 06-render.js ──
// ───────────────────────── 슬라이드 그리기 ─────────────────────────
let _defN = 0;
const defId = p => p + (++_defN);

function xfrmEl(e) {
  const n = ln(e);

  if (n === 'grpSp') return path(e, 'grpSpPr', 'xfrm');
  return path(e, 'spPr', 'xfrm');
}
// 위치·크기(EMU). 개체 틀이 자기 위치가 없으면 레이아웃 → 마스터 순서로 물려받는다

  let x = xfrmEl(e);
  let inherited = false;
  if (!x || !kid(x, 'off')) {
    for (const anc of phChain(info, e).reverse()) { const ax = xfrmEl(anc); if (ax && kid(ax, 'off')) { x = ax; inherited = true; break; } }
  }

}

// 배경: 슬라이드 → 레이아웃 → 마스터

    const bctx = { ...ctx, part: d === info.doc ? info.path : d === info.layoutDoc ? info.layoutPath : info.masterPath };
    if (pr) { const fe = findFill(pr); if (fe) return fillOf(fe, bctx); continue; }   // 채우기 없는 bgPr 는 건너뛴다
    const ref = kid(bg, 'bgRef');
    if (ref) return styleFill(ref, bctx) || { type: 'solid', color: colorOf(ref, bctx) };

}
function cssFill(f, deck) {
  if (!f || f.type === 'none') return 'transparent';
  if (f.type === 'solid') return css(f.color);
  if (f.type === 'grad') {
    const st = f.stops.map(s => `${css(s.color)} ${s.pos}%`).join(', ');
    return f.radial ? `radial-gradient(circle, ${st})` : `linear-gradient(${(f.angle + 90) % 360}deg, ${st})`;
  }
  if (f.type === 'blip') { const u = blipUrl(f, deck); return u ? `center / ${f.tile ? 'auto' : '100% 100%'} ${f.tile ? 'repeat' : 'no-repeat'} url("${u}")` : '#ddd'; }
  if (f.type === 'patt') return css(mix(f.fg, f.bg, pattRatio(f.prst)));

const pattRatio = p => { const m = /pct(\d+)/.exec(p || ''); return m ? +m[1] / 100 : 0.5; };
const mix = (a, b, t) => ({ r: a.r * t + b.r * (1 - t), g: a.g * t + b.g * (1 - t), b: a.b * t + b.b * (1 - t), a: 1 });

  if (!f.rid || !f.part) return null;
  const r = deck.pkg.rel(f.part, f.rid);
  return r ? deck.pkg.urlNow(r.target) : null;
}

// 슬라이드 하나 → div.slide
function renderSlide(deck, partPath, opts = {}) {
  const info = deck.info(partPath);
  const root = h('div', { class: 'slide' });
  root.style.width = deck.W + 'px'; root.style.height = deck.H + 'px';
  const ctx = { deck, info, theme: info.theme, clrMap: info.clrMap, part: partPath, editable: !!opts.editable, slideNo: opts.slideNo || (deck.slides.indexOf(partPath) + 1) };
  const bgf = backgroundOf(info, ctx);
  root.style.background = !bgf || bgf.type === 'none' ? '#fff' : cssFill(bgf, deck);
  if (!root.style.backgroundColor || root.style.backgroundColor === 'transparent') root.style.backgroundColor = '#fff';
  const top = { cx: 0, cy: 0, sx: 1, sy: 1 };
  const showMaster = attr(info.doc.documentElement, 'showMasterSp', '1') !== '0';
  // 슬라이드: 마스터 → 레이아웃 꾸밈, 레이아웃 미리보기: 마스터 꾸밈
  if ((info.kind === 'sld' || info.kind === 'sldLayout') && showMaster && info.layoutDoc && attr(info.layoutDoc.documentElement, 'showMasterSp', '1') !== '0' && info.masterDoc) {
    renderTree(spTreeOf(info.masterDoc), { ...ctx, part: info.masterPath, deco: true, info: deck.info(info.masterPath) }, top, root);
  }
  if (info.kind === 'sld' && showMaster && info.layoutDoc) renderTree(spTreeOf(info.layoutDoc), { ...ctx, part: info.layoutPath, deco: true, info: deck.info(info.layoutPath) }, top, root);
  renderTree(spTreeOf(info.doc), ctx, top, root);
  return root;
}

function renderTree(tree, ctx, map, parent) {
  if (!tree) return;
  for (const raw of kids(tree)) {
    const n = ln(raw);
    if (n === 'nvGrpSpPr' || n === 'grpSpPr' || n === 'extLst') continue;
    const e = altPick(raw);
    if (!e) continue;
    // 마스터·레이아웃의 개체 틀은 그리지 않는다(슬라이드가 물려받아 쓰는 틀)
    if (ctx.deco && phOf(e)) continue;
    let node = null;
    try {
      const k = ln(e);
      if (k === 'sp' || k === 'cxnSp') node = renderSp(e, ctx, map);
      else if (k === 'pic') node = renderPic(e, ctx, map);
      else if (k === 'grpSp') node = renderGrp(e, ctx, map);
      else if (k === 'graphicFrame') node = renderFrame(e, ctx, map);
      else if (k === 'contentPart') node = null;
    } catch (err) { console.warn('도형 그리기 실패', err); }
    if (!node) continue;
    node._x = e; node._raw = raw;
    if (ctx.deco) node.classList.add('deco');
    else if (ctx.editable && !ctx.inDiagram) node.classList.add('obj');
    parent.append(node);
  }
}

// EMU 상자 → 부모 안 px 위치
function place(node, b, map) {
  const x = (b.x - map.cx) * map.sx / EMU_PX, y = (b.y - map.cy) * map.sy / EMU_PX;
  const w = b.w * map.sx / EMU_PX, hh = b.h * map.sy / EMU_PX;
  const s = node.style;
  s.left = x + 'px'; s.top = y + 'px'; s.width = Math.max(0, w) + 'px'; s.height = Math.max(0, hh) + 'px';
  if (b.rot) s.transform = `rotate(${b.rot}deg)`;
  return { w, h: hh };
}

function shapeStyleCtx(e, ctx) {
  const st = kid(e, 'style');
  return {
    fillRef: st && kid(st, 'fillRef'), lnRef: st && kid(st, 'lnRef'), fontRef: st && kid(st, 'fontRef'),
  };
}

function renderSp(e, ctx, map) {
  const info = ctx.info;
  const b = boxOf(e, info);
  if (!b) return null;
  const node = h('div', { class: 'shp' });
  const { w, h: hh } = place(node, b, map);
  const spPr = kid(e, 'spPr');
  const chain = phChain(info, e);
  const st = shapeStyleCtx(e, ctx);
  // 모양: 자기 것 → 물려받은 것
  let geoSrc = spPr;
  if (!kid(spPr, 'prstGeom') && !kid(spPr, 'custGeom')) geoSrc = chain.map(a => kid(a, 'spPr')).reverse().find(x => x && (kid(x, 'prstGeom') || kid(x, 'custGeom'))) || spPr;
  const geo = shapeGeom(geoSrc, w, hh);
  // 채우기·선
  let fillE = findFill(spPr);
  if (!fillE) for (const a of chain.slice().reverse()) { fillE = findFill(kid(a, 'spPr')); if (fillE) break; }
  let fill = fillE ? fillOf(fillE, ctx) : st.fillRef ? styleFill(st.fillRef, ctx) : null;
  let lnE = kid(spPr, 'ln');
  if (!lnE) for (const a of chain.slice().reverse()) { lnE = kid(kid(a, 'spPr'), 'ln'); if (lnE) break; }
  const line = lineOf(lnE, ctx, st.lnRef);
  if (geo.line) fill = null;
  const svg = drawGeom(geo, fill, line, w, hh, ctx, b, shadowOf(e, ctx, chain));
  if (svg) node.append(svg);
  // 글자
  const txBody = kid(e, 'txBody');
  if (txBody || (ctx.editable && phOf(e))) {
    const tctx = textCtx(e, ctx, txBody);
    const tb = { w, h: hh };
    const txX = kid(e, 'txXfrm');   // SmartArt 의 글자 영역
    if (txX) {
      const o = kid(txX, 'off'), x2 = kid(txX, 'ext');
      tb.tl = (num(o, 'x', 0) - b.x) / EMU_PX; tb.tt = (num(o, 'y', 0) - b.y) / EMU_PX;
      tb.tr = w - tb.tl - num(x2, 'cx', 0) / EMU_PX; tb.tb = hh - tb.tt - num(x2, 'cy', 0) / EMU_PX;
    } else if (geo.tr) { tb.tl = geo.tr[0] * w; tb.tt = geo.tr[1] * hh; tb.tr = geo.tr[2] * w; tb.tb = geo.tr[3] * hh; }
    const tx = renderText(txBody, tctx, tb);
    if (tctx.bp.rot) tx.style.transform = `rotate(${tctx.bp.rot}deg)`;
    if (b.flipV && b.rot === 0) tx.style.transform = 'rotate(180deg)';
    node.append(tx);
    // 빈 개체 틀: 편집 화면에서만 안내 글
    if (tx._empty && phOf(e) && ctx.editable) {
      const t = normPh(phType(phOf(e)));
      if (!['dt', 'ftr', 'sldNum', 'hdr'].includes(t)) {
        node.classList.add('empty-ph');
        tx.dataset.prompt = t === 'title' ? '제목을 입력하려면 클릭' : phType(phOf(e)) === 'subTitle' ? '부제목을 입력하려면 클릭' : '텍스트를 입력하려면 클릭';
      }
    }
    node._tx = tx;
  }
  return node;
}

// 바깥 그림자(outerShdw): 도형 자신 → 물려받은 것 → 테마 효과 서식
function shadowOf(e, ctx, chain) {
  let eff = kid(kid(e, 'spPr'), 'effectLst');
  if (!eff) for (const a of chain.slice().reverse()) { eff = kid(kid(a, 'spPr'), 'effectLst'); if (eff) break; }
  let phClr = null;
  if (!eff && !kid(kid(e, 'spPr'), 'effectDag')) {
    const ref = kid(kid(e, 'style'), 'effectRef');
    const idx = num(ref, 'idx', 0);
    const es = idx > 0 && ctx.theme.effect ? ctx.theme.effect[idx - 1] : null;
    if (es) { eff = kid(es, 'effectLst'); if (kids(ref).length) phClr = colorOf(ref, ctx); }
  }
  const sh = eff && kid(eff, 'outerShdw');
  if (!sh) return null;
  const c = colorOf(sh, phClr ? { ...ctx, phClr } : ctx);
  if (!c || c.a === 0) return null;
  const blur = px(num(sh, 'blurRad', 0)), dist = px(num(sh, 'dist', 0)), dir = num(sh, 'dir', 0) / 60000 * Math.PI / 180;
  return { dx: dist * Math.cos(dir), dy: dist * Math.sin(dir), blur, color: c };
}

function textCtx(e, ctx, txBody) {
  const st = shapeStyleCtx(e, ctx);
  const ts = textSources(ctx.info, e, ctx.deck, txBody);
  return {
    ts, ctx, bp: bodyProps(ctx.info, e, txBody), slideNo: ctx.slideNo,
    fontRefColor: st.fontRef && kids(st.fontRef).length ? colorOf(st.fontRef, ctx) : null,
    fontRefIdx: st.fontRef ? attr(st.fontRef, 'idx', 'minor') : null,
  };
}

// 모양 SVG
function drawGeom(geo, fill, line, w, hh, ctx, b, shadow) {
  if (!geo || !geo.paths.length) return null;
  const NSV = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NSV, 'svg');
  svg.setAttribute('class', 'geo');
  svg.setAttribute('width', Math.max(1, w)); svg.setAttribute('height', Math.max(1, hh));
  svg.setAttribute('viewBox', `0 0 ${Math.max(1, w)} ${Math.max(1, hh)}`);
  const sx = (b.flipH ? -1 : 1) * (geo.flipX ? -1 : 1), sy = b.flipV ? -1 : 1;
  const defs = document.createElementNS(NSV, 'defs');
  svg.append(defs);
  const g = document.createElementNS(NSV, 'g');
  if (sx < 0 || sy < 0) g.setAttribute('transform', `translate(${sx < 0 ? w : 0},${sy < 0 ? hh : 0}) scale(${sx},${sy})`);
  // 그림자: SVG 필터(CSS filter 는 묶음 가장자리에 줄이 생기는 경우가 있다)
  let outer = g;
  if (shadow) {
    const id = defId('s');
    const f = document.createElementNS(NSV, 'filter');
    f.setAttribute('id', id); f.setAttribute('x', '-50%'); f.setAttribute('y', '-50%'); f.setAttribute('width', '200%'); f.setAttribute('height', '200%');
    f.setAttribute('color-interpolation-filters', 'sRGB');
    const ds = document.createElementNS(NSV, 'feDropShadow');
    ds.setAttribute('dx', shadow.dx.toFixed(2)); ds.setAttribute('dy', shadow.dy.toFixed(2)); ds.setAttribute('stdDeviation', (shadow.blur / 2).toFixed(2));
    ds.setAttribute('flood-color', '#' + toHex(shadow.color)); ds.setAttribute('flood-opacity', shadow.color.a);
    f.append(ds); defs.append(f);
    outer = document.createElementNS(NSV, 'g');
    outer.setAttribute('filter', `url(#${id})`);
    outer.append(g);
  }
  svg.append(outer);
  let fillAttr = 'none', fillOp = null;
  if (fill && fill.type === 'solid') { fillAttr = '#' + toHex(fill.color); if (fill.color.a < 1) fillOp = fill.color.a; }
  else if (fill && fill.type === 'grad') {
    const id = defId('g');
    const gr = document.createElementNS(NSV, fill.radial ? 'radialGradient' : 'linearGradient');
    gr.setAttribute('id', id);
    if (!fill.radial) gr.setAttribute('gradientTransform', `rotate(${fill.angle} 0.5 0.5)`);
    for (const s of fill.stops) { const so = document.createElementNS(NSV, 'stop'); so.setAttribute('offset', s.pos + '%'); so.setAttribute('stop-color', '#' + toHex(s.color)); if (s.color.a < 1) so.setAttribute('stop-opacity', s.color.a); gr.append(so); }
    defs.append(gr); fillAttr = `url(#${id})`;
  } else if (fill && fill.type === 'blip') {
    const u = blipUrl(fill, ctx.deck);
    if (u) {
      const id = defId('b');
      const pat = document.createElementNS(NSV, 'pattern');
      pat.setAttribute('id', id); pat.setAttribute('patternUnits', 'userSpaceOnUse'); pat.setAttribute('width', w); pat.setAttribute('height', hh);
      const im = document.createElementNS(NSV, 'image');
      im.setAttribute('href', u); im.setAttribute('width', w); im.setAttribute('height', hh); im.setAttribute('preserveAspectRatio', 'none');
      pat.append(im); defs.append(pat); fillAttr = `url(#${id})`;
    }
  } else if (fill && fill.type === 'patt') fillAttr = '#' + toHex(mix(fill.fg, fill.bg, pattRatio(fill.prst)));
  const stroke = line && !line.none && line.color;
  const mk = (type, end) => {
    const id = defId('m');
    const m = document.createElementNS(NSV, 'marker');
    m.setAttribute('id', id); m.setAttribute('viewBox', '0 0 10 10'); m.setAttribute('refX', type === 'arrow' ? 9 : 5); m.setAttribute('refY', 5);
    m.setAttribute('markerWidth', 3.5); m.setAttribute('markerHeight', 3.5); m.setAttribute('orient', 'auto-start-reverse');
    const p = document.createElementNS(NSV, 'path');
    p.setAttribute('d', type === 'oval' ? 'M5,0 A5,5 0 1 1 4.99,0 Z' : type === 'diamond' ? 'M5,0 L10,5 L5,10 L0,5 Z' : type === 'arrow' ? 'M0,0 L10,5 L0,10' : type === 'stealth' ? 'M0,0 L10,5 L0,10 L3,5 Z' : 'M0,0 L10,5 L0,10 Z');
    if (type === 'arrow') { p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#' + toHex(line.color)); p.setAttribute('stroke-width', 1.5); }
    else p.setAttribute('fill', '#' + toHex(line.color));
    m.append(p); defs.append(m);
    void end;
    return `url(#${id})`;
  };
  geo.paths.forEach((pp, i) => {
    const p = document.createElementNS(NSV, 'path');
    p.setAttribute('d', pp.d || 'M0,0');
    let f = pp.fill ? fillAttr : 'none';
    if (pp.fill && pp.shade && fill && fill.type === 'solid') { const hsl = rgbHsl(fill.color); hsl.l = clamp(hsl.l * pp.shade, 0, 1); f = '#' + toHex(hslRgb(hsl)); }
    p.setAttribute('fill', f);
    if (fillOp != null && pp.fill) p.setAttribute('fill-opacity', fillOp);
    if (pp.evenodd) p.setAttribute('fill-rule', 'evenodd');
    if (stroke && pp.stroke !== false) {
      p.setAttribute('stroke', '#' + toHex(line.color));
      if (line.color.a < 1) p.setAttribute('stroke-opacity', line.color.a);
      p.setAttribute('stroke-width', line.width);
      const da = line.dash && dashArray(line.dash, line.width); if (da) p.setAttribute('stroke-dasharray', da);
      p.setAttribute('stroke-linejoin', line.join || 'round');
      p.setAttribute('stroke-linecap', line.cap === 'rnd' ? 'round' : line.cap === 'sq' ? 'square' : 'butt');
      if (i === geo.paths.length - 1 || geo.line) { if (line.head) p.setAttribute('marker-start', mk(line.head, 'h')); if (line.tail) p.setAttribute('marker-end', mk(line.tail, 't')); }
    }
    p.setAttribute('vector-effect', 'non-scaling-stroke');
    g.append(p);
  });
  return svg;
}

function renderPic(e, ctx, map) {
  const b = boxOf(e, ctx.info);
  if (!b) return null;
  const node = h('div', { class: 'shp pic' });
  const { w, h: hh } = place(node, b, map);
  const bf = kid(e, 'blipFill');
  const blip = kid(bf, 'blip');
  const rid = rAttr(blip, 'embed') || rAttr(blip, 'link');
  const rel = rid ? ctx.deck.pkg.rel(ctx.part, rid) : null;
  const url = rel ? ctx.deck.pkg.urlNow(rel.target) : null;
  const clip = h('div', { class: 'clip' });
  const spPr = kid(e, 'spPr');
  const prst = kid(spPr, 'prstGeom');
  const pr = prst && attr(prst, 'prst');
  if (pr === 'ellipse') clip.style.borderRadius = '50%';
  else if (pr === 'roundRect') clip.style.borderRadius = Math.min(w, hh) * 0.1667 + 'px';
  if (url && !/\.(emf|wmf|tiff?|wdp)$/i.test(rel.target)) {
    const img = h('img', { src: url, draggable: 'false', alt: '' });
    const sr = kid(bf, 'srcRect');
    if (sr) {
      const l = num(sr, 'l', 0) / 100000, t = num(sr, 't', 0) / 100000, r = num(sr, 'r', 0) / 100000, bb = num(sr, 'b', 0) / 100000;
      const iw = w / Math.max(0.01, 1 - l - r), ih = hh / Math.max(0.01, 1 - t - bb);
      Object.assign(img.style, { width: iw + 'px', height: ih + 'px', left: -l * iw + 'px', top: -t * ih + 'px' });
    } else Object.assign(img.style, { width: '100%', height: '100%', left: '0', top: '0' });
    if (b.flipH || b.flipV) img.style.transform = `scale(${b.flipH ? -1 : 1},${b.flipV ? -1 : 1})`;
    clip.append(img);
  } else {
    clip.classList.add('missing');
    clip.append(h('span', { text: rel ? `그림(${extOf(rel.target).toUpperCase()}) — 이 브라우저에서 표시할 수 없음` : '그림 없음' }));
  }
  node.append(clip);
  const sd = shadowOf(e, ctx, []);
  const line = lineOf(kid(spPr, 'ln'), ctx, shapeStyleCtx(e, ctx).lnRef);
  const shs = [];
  if (line && !line.none && line.color) shs.push(`0 0 0 ${line.width}px ${css(line.color)}`);
  if (sd) shs.push(`${sd.dx.toFixed(1)}px ${sd.dy.toFixed(1)}px ${sd.blur.toFixed(1)}px ${css(sd.color)}`);
  if (shs.length) clip.style.boxShadow = shs.join(', ');
  return node;
}

function renderGrp(e, ctx, map) {
  const x = path(e, 'grpSpPr', 'xfrm');
  const node = h('div', { class: 'shp grp' });
  if (!x || !kid(x, 'off')) { renderTree(e, ctx, map, node); Object.assign(node.style, { left: 0, top: 0, width: '100%', height: '100%' }); return node; }
  const b = boxOf(e, ctx.info);
  const { w, h: hh } = place(node, b, map);
  const chOff = kid(x, 'chOff'), chExt = kid(x, 'chExt');
  const cw = num(chExt, 'cx', b.w) || b.w || 1, ch = num(chExt, 'cy', b.h) || b.h || 1;
  const inner = { cx: num(chOff, 'x', b.x), cy: num(chOff, 'y', b.y), sx: (w * EMU_PX) / cw, sy: (hh * EMU_PX) / ch };
  if (b.flipH || b.flipV) node.style.transform = `${node.style.transform || ''} scale(${b.flipH ? -1 : 1},${b.flipV ? -1 : 1})`;
  const gctx = { ...ctx, grpFill: fillOf(findFill(kid(e, 'grpSpPr')), ctx) };
  renderTree(e, { ...gctx, inGroup: true }, inner, node);
  // 그룹 안 개체는 그룹으로만 고른다
  for (const c of node.children) c.classList.remove('obj');
  return node;
}

// 표·차트·SmartArt·OLE
function renderFrame(e, ctx, map) {
  const b = boxOf(e, ctx.info);
  if (!b) return null;
  const gd = path(e, 'graphic', 'graphicData');
  const uri = attr(gd, 'uri', '');
  const node = h('div', { class: 'shp frame' });
  const { w, h: hh } = place(node, b, map);
  if (/table$/.test(uri)) { node.classList.add('tbl'); node.append(renderTable(kid(gd, 'tbl'), ctx, w, hh)); return node; }
  if (/chart$/.test(uri)) {
    const c = kid(gd, 'chart');
    const r = c ? ctx.deck.pkg.rel(ctx.part, rAttr(c, 'id')) : null;
    const doc = r ? ctx.deck.pkg.doc(r.target) : null;
    node.classList.add('chart');
    node.append(doc ? renderChart(doc, ctx, w, hh, r.target) : h('div', { class: 'ph-note', text: '차트' }));
    return node;
  }
  if (/diagram$/.test(uri)) {
    node.classList.add('dgm');
    const drawing = diagramDrawing(e, ctx);
    if (drawing) {
      const tree = desc(drawing.documentElement, 'spTree');
      const dpart = drawing._part;
      renderTree(tree, { ...ctx, part: dpart, inDiagram: true }, { cx: b.x, cy: b.y, sx: 1, sy: 1 }, node);
      for (const c of node.children) c.classList.remove('obj');
    } else node.append(h('div', { class: 'ph-note', text: 'SmartArt' }));
    return node;
  }
  // OLE 개체·기타: 안의 그림(미리보기)을 그린다
  const pic = desc(e, 'pic');
  const blip = desc(e, 'blip');
  if (pic || blip) {
    const rid = rAttr(blip, 'embed') || (pic ? rAttr(desc(pic, 'blip'), 'embed') : null);
    const rel = rid ? ctx.deck.pkg.rel(ctx.part, rid) : null;
    const url = rel ? ctx.deck.pkg.urlNow(rel.target) : null;
    if (url && !/\.(emf|wmf)$/i.test(rel.target)) { node.append(h('img', { src: url, draggable: 'false', style: 'width:100%;height:100%;display:block', alt: '' })); return node; }
  }
  node.append(h('div', { class: 'ph-note', text: /ole/i.test(uri) ? '포함된 개체' : '개체' }));
  return node;
}

function diagramDrawing(e, ctx) {
  const pkg = ctx.deck.pkg;
  const ids = desc(e, 'relIds');
  const dm = ids ? pkg.rel(ctx.part, rAttr(ids, 'dm')) : null;
  let rel = null;
  const dmDoc = dm ? pkg.doc(dm.target) : null;

async function openBuffer(buf, name, handle = null) {
  const bytes = new Uint8Array(buf);
  let deck;
  try {
    if (bytes[0] === 0xD0 && bytes[1] === 0xCF) {
      toast('옛 PowerPoint(.ppt) 파일을 읽는 중…', 8000);
      deck = await importPpt(buf, name);
      name = name.replace(/\.(ppt|pps|pot)$/i, '') + '.pptx';
      handle = null;
      toast('옛 .ppt 파일을 읽었습니다. 저장은 .pptx 로 합니다(글자·그림·도형 위주로 옮김).', 6000);
    } else if (bytes[0] === 0x50 && bytes[1] === 0x4B) {
      deck = await Deck.open(buf, name);
    } else throw new Error('PowerPoint 파일이 아닙니다(.pptx 또는 .ppt).');
  } catch (e) {
    console.error(e);
    dialog('파일을 열 수 없습니다', h('p', { text: e.message || String(e) }), [['확인', null, true]]);
    return false;

}

    const macro = /m$/.test(ext) || (ct && /macroEnabled/.test(ct.getAttribute('ContentType')));
    deck.pkg.setOverride(deck.presPath, macro ? 'application/vnd.ms-powerpoint.presentation.macroEnabled.main+xml' : 'application/vnd.openxmlformats-officedocument.presentationml.presentation.main+xml');
    name = name.replace(/\.[a-z0-9]+$/i, '') + (macro ? '.pptm' : '.pptx');

// 썸네일: 누르면 이동, 끌면 순서 바꾸기
function initThumbs() {
  const box = $('#thumbs');
  let dr = null;
  box.addEventListener('pointerdown', e => {
    const t = e.target.closest('.thumb'); if (!t || e.button > 0) return;
    // 손가락: 누르기만(끌면 목록이 넘어가게 둔다), 마우스: 끌어서 순서 바꾸기
    dr = { t, x0: e.clientX, y0: e.clientY, from: +t.dataset.i, moving: false, to: null, touch: e.pointerType === 'touch', h: narrow() };

    if (!dr) return;

    const r0 = box.getBoundingClientRect();
    if (dr.h) { if (pos < r0.left + 24) box.scrollLeft -= 12; else if (pos > r0.right - 24) box.scrollLeft += 12; }
    else if (pos < r0.top + 24) box.scrollTop -= 12; else if (pos > r0.bottom - 24) box.scrollTop += 12;
    const list = $$('#thumbs .thumb');
    let to = list.length;
    for (const x of list) { const r = x.getBoundingClientRect(); if (dr.h ? pos < r.left + r.width / 2 : pos < r.top + r.height / 2) { to = +x.dataset.i; break; } }
    dr.to = to;

  });
  const end = () => {
    if (!dr) return;
    const d = dr; dr = null;
    for (const x of $$('#thumbs .thumb')) x.classList.remove('drop-before', 'drop-after', 'dragging');
    if (!d.moving) { goSlide(d.from); return; }
    let to = d.to; if (to == null) return;

  box.addEventListener('pointerup', end);

}

function b64bytes(s) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }

async function newDeck() {
  if (!(await confirmDiscard())) return;
  const deck = await Deck.open(b64bytes(BLANK_PPTX_B64).buffer, '새 프레젠테이션.pptx');
  S.deck = deck;
  // 제목 슬라이드 하나로 시작(실행 취소 기록에 넣지 않는다)
  const m = allMasters()[0];
  const lays = layoutsOf(m);
  const title = lays.find(p => attr(deck.pkg.doc(p).documentElement, 'type') === 'title') || lays[0];
  newSlide(title, 0);
  useDeck(deck, '새 프레젠테이션.pptx', null);
}

// 저장 안 한 변경이 있으면 묻기 → true 면 계속
async function confirmDiscard() {
  if (!S.deck || !S.dirty) return true;
  const r = await dialog('저장하지 않은 변경 내용', h('p', { text: `‘${S.file.name}’의 변경 내용을 저장할까요?` }), [['취소', null], ['저장 안 함', 'no'], ['저장', 'save', true]]);
  if (r == null) return false;
  if (r === 'save') return await save(false);
  return true;
}

// ── 쓰이는 부분만 모으기(관계로 닿는 부분) ──
function reachableParts(pkg) {
  const seen = new Set();
  const stack = [];
  const root = pkg.doc('_rels/.rels');
  for (const e of kids(root && root.documentElement, 'Relationship')) if (e.getAttribute('TargetMode') !== 'External') stack.push(resolvePath('', e.getAttribute('Target')));
  while (stack.length) {
    const p = stack.pop();
    if (seen.has(p) || !pkg.has(p)) continue;
    seen.add(p);
    for (const r of pkg.rels(p)) if (r.mode !== 'External') stack.push(r.target);
  }
  return seen;
}

async function buildPptx() {
  const pkg = S.deck.pkg;
  touchDocProps();
  const keep = reachableParts(pkg);
  const out = new JSZip();
  const names = new Set(['[Content_Types].xml', '_rels/.rels']);
  for (const p of keep) { names.add(p); const rp = pkg.relsPath(p); if (pkg.has(rp)) names.add(rp); }
  // 부분 목록에서 빠진 부분의 Override 지우기(복사본에서)
  const types = parseXML(xmlString(pkg.types));
  for (const o of kids(types.documentElement, 'Override')) { const pn = o.getAttribute('PartName').replace(/^\//, ''); if (!names.has(pn)) o.remove(); }
  // 확장자 기본 형식이 없는 그림 등
  const defs = new Set(kids(types.documentElement, 'Default').map(e => (e.getAttribute('Extension') || '').toLowerCase()));
  const ovr = new Set(kids(types.documentElement, 'Override').map(e => e.getAttribute('PartName').replace(/^\//, '')));
  for (const n of names) {
    const ext = extOf(n);
    if (!ovr.has(n) && ext && !defs.has(ext)) {
      const e = types.createElementNS(NS.ct, 'Default'); e.setAttribute('Extension', ext); e.setAttribute('ContentType', MIME[ext] || 'application/octet-stream');
      types.documentElement.insertBefore(e, types.documentElement.firstChild); defs.add(ext);
    }
  }
  out.file('[Content_Types].xml', xmlString(types));
  for (const n of [...names].sort()) {
    if (n === '[Content_Types].xml') continue;
    if (pkg.xml.has(n) && !pkg.removed.has(n)) out.file(n, xmlString(pkg.xml.get(n)));
    else { const b = await pkg.bytes(n); if (b) out.file(n, b); }
  }
  return out.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 }, mimeType: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
}
// 문서 정보: 슬라이드 수·고친 시각
function touchDocProps() {
  const pkg = S.deck.pkg;
  const app = pkg.doc('docProps/app.xml');
  if (app) {
    const n = S.deck.slides.length;
    const set = (name, v) => { const e = kid(app.documentElement, name); if (e) e.textContent = String(v); };
    set('Slides', n);
    set('Notes', S.deck.slides.filter(p => notesPathOf(p)).length);
    set('HiddenSlides', S.deck.slides.filter(p => attr(pkg.doc(p).documentElement, 'show') === '0').length);
  }
  const core = pkg.doc('docProps/core.xml');
  if (core) { const m = kids(core.documentElement).find(e => ln(e) === 'modified'); if (m) m.textContent = new Date().toISOString().replace(/\.\d+Z$/, 'Z'); }
}

// ── 저장: 원본 덮어쓰기(가능할 때) → 다른 이름 → 내려받기 ──
let saving = false;
async function save(as = false) {
  if (!S.deck || saving) return false;
  if (S.editing) endTextEdit(true);
  flushNotes();
  saving = true;
  try {
    let blob;
    try { blob = await buildPptx(); }
    catch (e) { console.error(e); await dialog('저장하지 못했습니다', h('p', { text: e.message || String(e) }), [['확인', null, true]]); return false; }
    const name = S.file.name;
    const fh = S.file.handle;
    if (!as && fh && fh.createWritable) {
      if (!S.file.confirmed) {
        const r = await dialog('원본 파일에 저장', h('p', { text: `‘${name}’ 파일을 고친 내용으로 바꿉니다. 원본을 그대로 두려면 ‘다른 이름으로 저장’을 누르세요.` }), [['취소', null], ['다른 이름으로 저장', 'as'], ['덮어쓰기', 'ok', true]]);
        if (r == null) return false;
        if (r === 'as') { saving = false; return await save(true); }
        S.file.confirmed = true;
      }
      try {
        if (fh.queryPermission && (await fh.queryPermission({ mode: 'readwrite' })) !== 'granted' && (await fh.requestPermission({ mode: 'readwrite' })) !== 'granted') throw new Error('쓰기 권한이 없습니다');
        const w = await fh.createWritable(); await w.write(blob); await w.close();
        return saved(name, false);
      } catch (e) {
        if (e && e.name === 'AbortError') return false;
        console.warn(e); toast('원본 파일에 쓸 수 없어 새 파일로 저장합니다.', 3500);
      }
    }
    const ext = extOf(name) === 'pptm' ? 'pptm' : 'pptx';
    if (window.showSaveFilePicker) {

    if (!b) return '';
    const g = gsh.grpBounds || { l: 0, t: 0, r: b.w, b: b.h };
    let inner = '';
    for (let i = 1; i < kidsR.length; i++) inner += await shapeXmlOf(kidsR[i], ctx, { ...opt, inGroup: true }, gsh);
    if (!inner) return '';
    const id = ctx.ids.n++;
    return `<p:grpSp><p:nvGrpSpPr><p:cNvPr id="${id}" name="Group ${id}"/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr>${xfrmXml(b, gsh, 'a:xfrm', g)}</p:grpSpPr>${inner}</p:grpSp>`;
  }

  if (sh.flags & 0x4) return '';                 // 맨 위 그룹 자신
  const b = anchorBox(sh, parent);
  if (!b) return '';
  let phType = sh.ph ? PH_TYPE[sh.ph.id] : null;
  if (sh.ph && opt.skipPh) return '';
  if (phType && ['dt', 'sldNum', 'ftr', 'hdr'].includes(phType)) return '';
  const id = ctx.ids.n++;
  const blk = textBlockOf(ctx, sh);
  const pib = optV(sh, 0x0104, 0);
  const nameOpt = sh.opt.get(0x0380);
  const nm = nameOpt && nameOpt.data ? new PptStream(nameOpt.data).utf16(0, nameOpt.data.length).split('\0')[0] : '';
  // 그림
  if (pib && !(blk && blk.text)) {
    const p = await pptBlip(ctx, pib);
    if (p) {
      const rid = ctx.pkg.addRel(ctx.part, REL.image, p);
      const crop = (pid) => { const v = optV(sh, pid, 0) | 0; return Math.round(v / 65536 * 100000); };
      const ct = crop(0x0100), cb = crop(0x0101), cl = crop(0x0102), cr = crop(0x0103);
      const src = ct || cb || cl || cr ? `<a:srcRect${cl ? ` l="${cl}"` : ''}${ct ? ` t="${ct}"` : ''}${cr ? ` r="${cr}"` : ''}${cb ? ` b="${cb}"` : ''}/>` : '';
      const ln2 = optBool(sh, 0x01FF, 0x8, false) ? lineXml(sh, ctx) : '';
      return `<p:pic><p:nvPicPr><p:cNvPr id="${id}" name="${esc(nm || 'Picture ' + id)}"/><p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr><p:nvPr/></p:nvPicPr><p:blipFill><a:blip r:embed="${rid}"/>${src}<a:stretch><a:fillRect/></a:stretch></p:blipFill><p:spPr>${xfrmXml(b, sh)}<a:prstGeom prst="rect"><a:avLst/></a:prstGeom>${ln2}</p:spPr></p:pic>`;
    }

  const prst = MSOSPT[sh.type];
  const isLine = prst === 'line' || /Connector/.test(prst || '');
  if (isLine) {
    return `<p:cxnSp><p:nvCxnSpPr><p:cNvPr id="${id}" name="${esc(nm || 'Connector ' + id)}"/><p:cNvCxnSpPr/><p:nvPr/></p:nvCxnSpPr><p:spPr>${xfrmXml(b, sh)}<a:prstGeom prst="${prst === 'line' ? 'line' : prst}"><a:avLst/></a:prstGeom>${lineXml(sh, ctx)}</p:spPr></p:cxnSp>`;
  }
  let phX = '';
  if (phType) {
    if (opt.phOut) opt.phOut.push(phType);

      : phType === 'subTitle' ? '<p:ph type="subTitle" idx="1"/>'
        : phType === 'body' || phType === 'obj' ? `<p:ph${vert ? ' orient="vert"' : ''} idx="${cnt}"/>`
          : `<p:ph type="${phType}" idx="${10 + id}"/>`;
  }
  const isTxBox = sh.type === 202 && !phType;
  const fill = phType && !optGet(sh, 0x01BF) && !optGet(sh, 0x0181) ? '<a:noFill/>' : await fillXml(sh, ctx);
  const line = phType && !optGet(sh, 0x01FF) && !optGet(sh, 0x01C0) ? '' : lineXml(sh, ctx);
  const tb = blk ? textBodyXml(blk, ctx, bodyPrXml(sh, !!phType)) : phType ? `<p:txBody>${bodyPrXml(sh, true)}<a:lstStyle/><a:p><a:endParaRPr lang="ko-KR" altLang="en-US"/></a:p></p:txBody>` : '';
  return `<p:sp><p:nvSpPr><p:cNvPr id="${id}" name="${esc(nm || (phType ? phType + ' ' + id : isTxBox ? 'TextBox ' + id : 'Shape ' + id))}"/><p:cNvSpPr${isTxBox ? ' txBox="1"' : ''}>${phType ? '<a:spLocks noGrp="1"/>' : ''}</p:cNvSpPr><p:nvPr>${phX}</p:nvPr></p:nvSpPr><p:spPr>${xfrmXml(b, sh)}${geomXml(sh)}${fill}${line}</p:spPr>${tb}</p:sp>`;
}
// 메모 슬라이드의 본문 글
function notesTextOf(r, entry, ctx) {
  const D = ctx.D;
  const dg = D.deep(D.kid(r, 0x040C), 0xF002);
  const all = [];
  const walk = rec => { for (const c of D.kids(rec)) { if (c.type === 0xF004) all.push(pptShape(D, c)); else if (c.type === 0xF003) walk(c); } };
  if (dg) walk(dg);
  const body = all.find(s => s.ph && (s.ph.id === 0x0C || s.ph.id === 0x06)) || all.find(s => s.textbox);
  if (!body) return entry.texts.filter(t => t.type === 2).map(t => t.text).join('\n').replace(/[\r\u000B]/g, '\n');
  const blk = textBlockOf({ ...ctx, texts: entry.texts }, body);
  return blk ? blk.text.replace(/[\r\u000B]/g, '\n').replace(/[\u0000-\u0008\u000C\u000E-\u001F]/g, '') : '';
}

const inField = t => t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || (t.isContentEditable && !(S.editing && S.editing.inner.contains(t))));

function onKey(e) {

  if (SHOW.on) { if (showKey(e)) e.preventDefault(); return; }
  if (!$('#dialog').hidden) return;
  if (mod && (k === 's' || k === 'S')) { e.preventDefault(); if (S.deck) save(e.shiftKey); return; }
  if (mod && (k === 'o' || k === 'O')) { e.preventDefault(); openFile(); return; }
  if (k === 'F5') { e.preventDefault(); if (S.deck) startShow(e.shiftKey); return; }
  if (!S.deck) return;
  if (S.editing) {
    if (e.isComposing || e.keyCode === 229) return;   // 한글 조합 중에는 건드리지 않는다
    if (k === 'Escape') { e.preventDefault(); const x = S.editing.node._x; endTextEdit(true); select(S.sel.length ? S.sel : [x].filter(nodeOf)); return; }
    if (k === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '\t'); return; }
    return;
  }
  if (inField(e.target)) return;
  if (mod && (k === 'z' || k === 'Z')) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (mod && (k === 'y' || k === 'Y')) { e.preventDefault(); redo(); return; }
  if (mod && (k === 'd' || k === 'D')) { e.preventDefault(); duplicateSel(); return; }
  if (mod && (k === 'a' || k === 'A')) { e.preventDefault(); select([...$$('#slideHost .slide > .obj')].map(n => n._x)); return; }
  if (mod && (k === 'm' || k === 'M')) { e.preventDefault(); const info = S.deck.slides[S.cur] ? S.deck.info(S.deck.slides[S.cur]) : null; const m = info ? info.masterPath : allMasters()[0]; const l = m && defaultLayout(m, info && info.layoutPath); if (l) addSlideWith(l); return; }
  if (mod && (k === 'b' || k === 'B')) { e.preventDefault(); format('bold'); return; }
  if (mod && (k === 'i' || k === 'I')) { e.preventDefault(); format('italic'); return; }
  if (mod && (k === 'u' || k === 'U')) { e.preventDefault(); format('underline'); return; }
  if (mod && (k === ']' || k === '>')) { e.preventDefault(); format('grow'); return; }
  if (mod && (k === '[' || k === '<')) { e.preventDefault(); format('shrink'); return; }
  if (k === 'Delete' || k === 'Backspace') { if (S.sel.length) { e.preventDefault(); deleteSel(); } return; }
  if (k === 'Escape') { if (S.sel.length) select([]); return; }
  if ((k === 'Enter' || k === 'F2') && S.sel.length === 1) {
    const n = nodeOf(S.sel[0]);
    if (n && n._tx) { e.preventDefault(); startTextEdit(n._tx, n, S.sel[0], null, { selectAll: k === 'Enter' }); }
    return;
  }
  const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (arrows[k] && S.sel.length) { e.preventDefault(); const st = e.shiftKey ? 10 : mod ? 0.25 : 1; nudge(arrows[k][0] * st, arrows[k][1] * st); return; }
  if ((arrows[k] && !S.sel.length && e.target.closest && !e.target.closest('#notes')) || k === 'PageUp' || k === 'PageDown') {
    e.preventDefault();
    goSlide(S.cur + (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(k) ? -1 : 1));
    return;
  }
  if (k === 'Home' && !S.sel.length) { e.preventDefault(); goSlide(0); return; }
  if (k === 'End' && !S.sel.length) { e.preventDefault(); goSlide(S.deck.slides.length - 1); return; }
}
