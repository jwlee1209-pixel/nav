<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPT 편집기</title>
<link rel="icon" href="/*@FAVICON@*/">
<!--@WEBHEAD@-->
<style>/*@CSS@*/</style>
</head>
<body>
<div id="app" data-state="empty">
  <header class="bar" id="bar1">
    <div class="brand"><span class="logo">P</span><b>PPT 편집기</b><span class="ver" id="ver"></span></div>
    <div class="grp">
      <button id="bOpen" class="btn" title="열기 (Ctrl+O)"></button>
      <button id="bSave" class="btn need" title="저장 (Ctrl+S)"></button>
      <button id="bSaveAs" class="btn need" title="다른 이름으로 저장"></button>
    </div>
    <div class="grp need">
      <button id="bUndo" class="ibtn" title="실행 취소 (Ctrl+Z)"></button>
      <button id="bRedo" class="ibtn" title="다시 실행 (Ctrl+Y)"></button>
    </div>
    <div class="grp need">
      <button id="bText" class="btn" title="텍스트 상자 넣기"></button>
      <button id="bImage" class="btn" title="그림 넣기"></button>
      <div class="dd"><button id="bShape" class="btn" title="도형 넣기"></button><div class="menu" id="shapeMenu" hidden></div></div>
      <button id="bTable" class="btn" title="표 넣기"></button>
    </div>
    <div class="grp right need">
      <button id="bPdf" class="btn" title="PDF로 저장(인쇄)"></button>
      <button id="bShow" class="btn primary" title="슬라이드 쇼 (F5, Shift+누르기: 지금 슬라이드부터)"></button>
      <button id="bHelp" class="ibtn" title="도움말·단축키">?</button>
    </div>
  </header>
  <header class="bar sub need" id="bar2">
    <div class="grp">
      <select id="fFont" title="글꼴"></select>
      <input id="fSize" type="number" min="1" max="400" step="1" title="글자 크기(pt)">
      <button id="fGrow" class="ibtn" title="글자 크게"></button>
      <button id="fShrink" class="ibtn" title="글자 작게"></button>
    </div>
    <div class="grp">
      <button id="fB" class="ibtn" title="굵게 (Ctrl+B)"><b>가</b></button>
      <button id="fI" class="ibtn" title="기울임 (Ctrl+I)"><i>가</i></button>
      <button id="fU" class="ibtn" title="밑줄 (Ctrl+U)"><u>가</u></button>
      <button id="fS" class="ibtn" title="취소선"><s>가</s></button>
      <label class="clr" title="글자 색"><span class="sw" id="fColorSw"></span><span class="lbl">가</span><input id="fColor" type="color"></label>
    </div>
    <div class="grp">
      <button id="aL" class="ibtn" title="왼쪽 맞춤"></button>
      <button id="aC" class="ibtn" title="가운데 맞춤"></button>
      <button id="aR" class="ibtn" title="오른쪽 맞춤"></button>
      <button id="aJ" class="ibtn" title="양쪽 맞춤"></button>
      <button id="fBul" class="ibtn" title="글머리 기호"></button>
      <button id="fNum" class="ibtn" title="번호 매기기"></button>
    </div>
    <div class="grp">
      <label class="clr" title="도형 채우기"><span class="sw" id="sFillSw"></span><span class="lbl">채우기</span><input id="sFill" type="color"></label>
      <button id="sNoFill" class="ibtn sm" title="채우기 없음">없음</button>
      <label class="clr" title="도형 윤곽선"><span class="sw line" id="sLineSw"></span><span class="lbl">윤곽선</span><input id="sLine" type="color"></label>
      <select id="sLineW" title="윤곽선 두께"><option value="">두께</option><option value="0">없음</option><option value="0.75">0.75pt</option><option value="1.5">1.5pt</option><option value="2.25">2.25pt</option><option value="3">3pt</option><option value="4.5">4.5pt</option><option value="6">6pt</option></select>
    </div>
    <div class="grp">
      <button id="zFront" class="ibtn" title="맨 앞으로"></button>
      <button id="zBack" class="ibtn" title="맨 뒤로"></button>
      <button id="bDup" class="ibtn" title="복제 (Ctrl+D)"></button>
      <button id="bDel" class="ibtn" title="삭제 (Delete)"></button>
    </div>
    <div class="grp right">
      <button id="zOut" class="ibtn" title="축소"></button>
      <span id="zLabel" class="zl">100%</span>
      <button id="zIn" class="ibtn" title="확대"></button>
      <button id="zFit" class="btn sm" title="창에 맞춤">맞춤</button>
    </div>
  </header>
  <main id="main">
    <aside id="side" class="need">
      <div id="thumbs"></div>
      <div class="sidebtns">
        <button id="sAdd" class="btn sm" title="새 슬라이드"></button>
        <button id="sDup" class="ibtn" title="슬라이드 복제"></button>
        <button id="sDel" class="ibtn" title="슬라이드 삭제"></button>
      </div>
    </aside>
    <section id="work">
      <div id="welcome">
        <div class="wbox">
          <div class="logo big">P</div>
          <h1>PPT 편집기</h1>
          <p>PowerPoint 파일(.pptx, .ppt)을 열어 글자·도형·그림·슬라이드를 고치고 .pptx 로 저장합니다.<br>파일은 이 컴퓨터 안에서만 처리되고 어디에도 올라가지 않습니다.</p>
          <button id="wOpen" class="btn primary lg">파일 열기</button>
          <p class="hint">또는 파일을 이 창에 끌어다 놓으세요</p>
          <button id="wNew" class="btn">새 발표 자료</button>
          <div id="wMoved" class="wmoved" hidden></div>
          <div id="wApp" class="wapp" hidden>
            <button id="wInstall" class="btn">앱으로 설치</button>
            <p class="hint">설치하면 PC 는 파일 탐색기에서 .pptx·.ppt 파일을 두 번 눌러(연결 프로그램 → PPT 편집기), 휴대폰은 파일의 ‘공유 → PPT 편집기’로 바로 열 수 있습니다.</p>
          </div>
        </div>
      </div>
      <div id="stageWrap"><div id="stage"><div id="slideHost"></div><div id="overlay"></div></div></div>
      <div id="notes" class="need"><label for="notesText">메모</label><textarea id="notesText" placeholder="슬라이드 노트(발표자 메모)를 입력하세요"></textarea></div>
    </section>
  </main>
  <footer id="status"><span id="stFile"></span><span id="stSlide"></span><span id="stSel"></span></footer>
</div>
<div id="dropZone" hidden><div>여기에 놓으면 엽니다</div></div>
<div id="show" hidden><div id="showSlide"></div><div id="showInfo"></div></div>
<div id="printArea"></div>
<div id="dialog" hidden></div>
<div id="toast" hidden></div>
<div id="ctxMenu" class="ctx" hidden></div>
<input id="fileIn" type="file" accept=".pptx,.ppt,.potx,.ppsx,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.ms-powerpoint" hidden>
<input id="imgIn" type="file" accept="image/*" hidden>
<script>/*@JSZIP@*/</script>
<script>/*@APP@*/</script>
</body>
</html>
