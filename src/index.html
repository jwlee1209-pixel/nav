<!doctype html>
<html lang="ko" data-mode="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B5CAD">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="길잡이 내비">
<meta name="description" content="무료 지도(OpenStreetMap)로 길을 찾고 한국어 음성으로 안내하는 개인용 차량 내비게이션">
<title>길잡이 내비</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B5CAD'/%3E%3Cpath d='M11 25V15.5a3.5 3.5 0 0 1 3.5-3.5H20' fill='none' stroke='%23fff' stroke-width='3.4' stroke-linecap='round'/%3E%3Cpath d='M19 7.2 25.5 12 19 16.8z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>/*@MAPLIBRE_CSS@*/</style>
<style>/*@CSS@*/</style>
</head>
<body>
<div id="app" data-screen="home">
  <div id="map" aria-label="지도"></div>

  <header class="top" id="top">
    <form id="searchForm" class="search" role="search" autocomplete="off">
      <svg class="search__mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0B5CAD"/><path d="M11 25V15.5a3.5 3.5 0 0 1 3.5-3.5H20" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><path d="M19 7.2 25.5 12 19 16.8z" fill="#fff"/></svg>
      <input id="q" type="search" enterkeyhint="search" placeholder="어디로 갈까요?" aria-label="장소·주소 검색" maxlength="80">
      <button type="button" id="qClear" class="icon-btn" aria-label="검색 닫기" hidden></button>
      <button type="submit" id="qGo" class="icon-btn" aria-label="검색"></button>
    </form>
    <button type="button" id="btnSettings" class="icon-btn icon-btn--card" aria-label="설정"></button>
  </header>
  <nav id="chips" class="chips" aria-label="바로 가기"></nav>

  <section id="plan" class="plan card" aria-label="경로 설정"></section>

  <section id="mpanel" class="mpanel" aria-live="polite">
    <div class="mpanel__icon" id="mpIcon"></div>
    <div class="mpanel__main">
      <div class="mpanel__dist"><b id="mpDist">-</b><span id="mpUnit"></span></div>
      <div class="mpanel__title" id="mpTitle"></div>
      <div class="mpanel__sub" id="mpSub"></div>
    </div>
  </section>
  <div id="nexthint" class="nexthint" hidden></div>
  <div id="caption" class="caption" hidden></div>
  <div id="banner" class="banner" role="status" hidden></div>

  <div class="fabs" id="fabs">
    <button type="button" id="btnNorth" class="fab" aria-label="지도를 북쪽 위로" hidden></button>
    <button type="button" id="btnLocate" class="fab" aria-label="내 위치로 이동"></button>
  </div>
  <div id="speed" class="speed" aria-label="현재 속도"><b id="spd">0</b><span>km/h</span></div>
  <button type="button" id="btnRecenter" class="fab fab--wide recenter" hidden></button>

  <footer id="gbar" class="gbar">
    <div class="gbar__stats">
      <span class="gbar__time num" id="gTime">-</span>
      <span class="gbar__eta num"><small>도착</small><span id="gEta">-</span></span>
      <span class="gbar__dist num"><small>남은</small><span id="gDist">-</span></span>
    </div>
    <div class="simbar" id="simbar" hidden></div>
    <div class="gbar__btns">
      <button type="button" class="gbtn" id="gOverview" aria-label="전체 경로 보기"></button>
      <button type="button" class="gbtn" id="gVoice" aria-label="음성 안내 켜기/끄기"></button>
      <button type="button" class="gbtn gbtn--end" id="gEnd">종료</button>
    </div>
  </footer>

  <section id="sheet" class="sheet" data-size="peek">
    <button type="button" class="sheet__grip" id="grip" aria-label="목록 크게/작게"></button>
    <div class="sheet__body" id="sheetBody"></div>
  </section>

  <div id="overlay" class="overlay" hidden></div>
  <div id="dialog" class="dialog" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="boot" class="boot">지도를 준비하는 중…</div>
</div>
<script>/*@MAPLIBRE_JS@*/</script>
<script>/*@APP@*/</script>
</body>
</html>
